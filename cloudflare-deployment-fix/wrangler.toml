# Cloudflare Pages & Workers Configuration
# This file resolves the KV namespace error and implements best practices

name = "lmm-finance"
compatibility_date = "2024-11-25"
pages_build_output_dir = "dist"

# Build configuration
[build]
command = "npm run build"
cwd = "."

# Production environment variables (non-sensitive)
[vars]
ENVIRONMENT = "production"
EMAIL_FROM = "info@symbolai.net"
EMAIL_FROM_NAME = "LMM Finance"
ADMIN_EMAIL = "admin@symbolai.net"

# Cloudflare Access configuration
CF_ACCESS_AUD = "ba5ee91d628f0c6a7bfe4f7896efec7944113399cdefb021f06f28bc7911336b"
CF_ACCESS_CLIENT_ID = "0819d605ab60810ba7b56ca903c7405f.access"
CF_ACCESS_TEAM = "symbolai"
CF_ACCESS_CERTS_URL = "https://symbolai.cloudflareaccess.com/cdn-cgi/access/certs"

# AI Gateway configuration
AI_GATEWAY_ACCOUNT_ID = "85b01d19439ca53d3cfa740d2621a2bd"
AI_GATEWAY_NAME = "symbol"
CLOUDFLARE_GATEWAY_ID = "3c9bde8186fe4c868defcc441f28ca5e"
CLOUDFLARE_GATEWAY_DOMAIN = "xnoojzri3g.cloudflare-gateway.com"

# KV Namespace Bindings
# IMPORTANT: Create these namespaces first using the commands in setup-kv-namespaces.sh
[[kv_namespaces]]
binding = "CACHE"
id = "606e2671e250401bbc01f097797f1f66"  # Replace with your actual namespace ID
preview_id = "606e2671e250401bbc01f097797f1f66"  # For preview deployments

